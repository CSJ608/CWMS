<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CWMS · 大屏看板</title>
<style>
  :root {
    --bg: #0b1020; --panel: #121a30; --panel-2: #0e1526; --line: #223055;
    --text: #e8edf7; --muted: #8ea0c0; --accent: #4f8cff; --green: #35c48d; --red: #ff6b6b; --amber: #ffb35c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; padding: 14px 22px;
    border-bottom: 1px solid var(--line); background: var(--panel-2);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 0.5px; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  main { padding: 14px 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .panel h2 { font-size: 13px; margin: 2px 0 10px; color: var(--muted); font-weight: 600; letter-spacing: 1px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card {
    background: linear-gradient(160deg, #16224200, #0a0f1e00), var(--panel-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  .card .t { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 30px; font-weight: 700; margin-top: 4px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .board { display: flex; gap: 8px; overflow-x: auto; }
  .col { min-width: 118px; flex: 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .col .st { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .col .st b { color: var(--text); }
  .chip { font-size: 11.5px; background: #1b2449; border-radius: 5px; padding: 2px 6px; margin-bottom: 4px; color: #b9c7e4; word-break: break-all; }
  .empty { color: #55648a; font-size: 12.5px; padding: 8px 2px; }
</style>
</head>
<body>
<header>
  <h1>CWMS · 大屏看板</h1>
  <span class="sub">指标与作业：CardView + task/changed（ADR-0004/0010）｜<a href="/pc" style="color:var(--accent)">PC →</a></span>
</header>

<main>
  <section class="panel">
    <h2>卡片与作业看板（CardView + task/changed）</h2>
    <div class="cards" id="cards"></div>
    <div class="board" id="board"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id)

async function api(path) {
  const res = await fetch('/api/' + path)
  return res.json()
}

async function refresh() {
  const s = await api('state')
  $('cards').innerHTML = s.cards.map((c) =>
    `<div class="card"><div class="t">${esc(c.title)}</div><div class="v">${esc(c.value)}</div></div>`).join('')
  $('board').innerHTML = s.board.columns.map((col) =>
    `<div class="col"><div class="st"><span>${esc(col.status)}</span><b>${col.count}</b></div>` +
    col.taskIds.map((id) => `<div class="chip">${esc(id)}</div>`).join('') + `</div>`).join('')
    || `<div class="empty">（无任务）</div>`
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (ch) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch])
}

document.addEventListener('DOMContentLoaded', () => {
  refresh()
  setInterval(refresh, 1500)
})
</script>
</body>
</html>
