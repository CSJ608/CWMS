# 三端部署反代（ADR-0013）：静态两页 + /api 转发 backend
server {
  listen 80;

  location /api/ {
    proxy_pass http://backend:8787;
    proxy_set_header Host $host;
  }

  # 大屏是独立人群的独立入口（ADR-0013）
  location = /board {
    root /usr/share/nginx/html;
    try_files /board.html =404;
  }

  # / 与 /pc 都是操作台
  location / {
    root /usr/share/nginx/html;
    try_files /pc.html =404;
  }
}
